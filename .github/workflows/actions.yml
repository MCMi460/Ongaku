name: 'Build Ongaku'
on:
  release:
    types: [published]

jobs:
  build:
    name: 'Build Ongaku'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['macos-latest']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: 3.13

    - name: "Build"
      if: matrix.os == 'macos-latest'
      run: |
        ./build.sh &&
        cd ./dist &&
        zip -yr x86_64.zip Ongaku.app/

    - name: "Upload Build"
      if: matrix.os == 'macos-latest'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/x86_64.zip
